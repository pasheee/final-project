[project]
name = "finalproject"
version = "0.1.0"
description = "Консольный портфель фиатных и криптовалют"
readme = "README.md"
authors = [
    { name = "pasheee", email = "pasheee@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "frozendict>=2.4.7",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[project.scripts]
finalproject = "valutatrade_hub.main:main"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.uv.build-backend]
module-root = ""
module-name = "valutatrade_hub"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
